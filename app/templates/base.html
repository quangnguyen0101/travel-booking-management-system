<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booking{% endblock %} · BTL2 Nhóm 5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('booking_list') }}">Booking · Nhóm 5</a>
    <div class="navbar-nav">
      <a class="nav-link {{ 'active' if request.endpoint in ('booking_list', 'booking_edit') }}" href="{{ url_for('booking_list') }}">Danh sách</a>
      <a class="nav-link {{ 'active' if request.endpoint == 'booking_new' }}" href="{{ url_for('booking_new') }}">Thêm đơn</a>
      <a class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
    {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
  </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
