<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booking{% endblock %} · BTL2 Nhóm 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --accent: #1D4ED8; --accent-dark: #1E3A8A; --line: #E5E5E5; --muted: #595959;
      --bs-body-font-family: Geist, system-ui, sans-serif; --bs-body-font-size: 13px;
      --bs-body-color: #111111; --bs-body-bg: #FAFAFA; --bs-border-color: #D4D4D4;
      --bs-border-radius: 3px; --bs-border-radius-sm: 2px; --bs-border-radius-lg: 4px;
      --bs-link-color: #1D4ED8; --bs-link-color-rgb: 29, 78, 216; --bs-link-hover-color: #1E3A8A; --bs-link-hover-color-rgb: 30, 58, 138;
      --bs-secondary-color: #595959;
    }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .muted { color: var(--muted); }
    .btn { --bs-btn-font-size: 13px; --bs-btn-border-radius: 3px; --bs-btn-font-weight: 500; }
    .btn-primary { --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent); --bs-btn-hover-bg: #1E40AF;
      --bs-btn-hover-border-color: #1E40AF; --bs-btn-active-bg: var(--accent-dark); --bs-btn-active-border-color: var(--accent-dark); }
    .btn-dark { --bs-btn-bg: #111111; --bs-btn-border-color: #111111; }
    .btn-outline-secondary { --bs-btn-color: #404040; --bs-btn-border-color: #D4D4D4; --bs-btn-hover-bg: #F5F5F5;
      --bs-btn-hover-color: #111111; --bs-btn-hover-border-color: #A3A3A3; --bs-btn-bg: #FFFFFF; }
    .btn-outline-danger { --bs-btn-color: #B91C1C; --bs-btn-border-color: #FCA5A5; --bs-btn-bg: #FFFFFF; }
    .btn-link { --bs-btn-padding-x: 6px; text-decoration: none; }
    .form-control, .form-select { font-size: 13px; min-height: 38px; border-radius: 3px; }
    .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(29, 78, 216, .2); }
    .form-label { font-size: 12px; color: #404040; margin-bottom: 4px; }
    .form-control:disabled { background: #F5F5F5; color: #404040; }
    .alert { border-radius: 3px; padding: 10px 40px 10px 12px; font-size: 13px; }
    .alert-dismissible .btn-close { padding: 12px; }

    .shell { display: flex; flex-wrap: wrap; min-height: 100vh; }
    .side { flex: 1 1 208px; background: #FFFFFF; border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; }
    .brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; color: inherit; text-decoration: none; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 8px; border-radius: 3px; color: #404040; text-decoration: none; }
    .nav-item:hover { background: #F5F5F5; color: #111111; }
    .nav-item.active { background: #F0F0F0; color: #111111; font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
    .side-foot { margin-top: auto; padding: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .content { flex: 999 1 560px; min-width: 0; padding: 20px 28px 40px; }

    .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--muted); }
    .title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat b { font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500; }
    .stat span { font-size: 12px; color: var(--muted); }
    .panel { background: #FFFFFF; border: 1px solid var(--line); border-radius: 3px; }
    .section-label { font-size: 12px; font-weight: 600; color: #404040; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }

    .table { --bs-table-bg: #FFFFFF; --bs-table-hover-bg: #FAFAFA; --bs-border-color: #EDEDED; font-size: 13px; margin: 0; }
    .table > :not(caption) > * > * { padding: 8px 12px; }
    .table thead th { background: #F5F5F5; color: #404040; font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }

    .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .st::before { content: ''; width: 7px; height: 7px; border-radius: 1px; background: #8C8C8C; }
    .st-PENDING::before { background: #B45309; } .st-CONFIRMED::before { background: var(--accent); } .st-COMPLETED::before { background: #15803D; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; border: 1px solid var(--line); color: var(--muted); }
    .tag-PLATINUM { background: #111111; border-color: #111111; color: #FFFFFF; }
    .tag-GOLD { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
    .tag-SILVER { border-color: #A3A3A3; color: #262626; }

    .pagination { --bs-pagination-font-size: 13px; --bs-pagination-color: #404040; --bs-pagination-border-color: #D4D4D4; --bs-pagination-border-radius: 3px;
      --bs-pagination-active-bg: #111111; --bs-pagination-active-border-color: #111111; --bs-pagination-hover-color: #111111; font-family: 'Geist Mono', monospace; }
    .bento { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    .bento > section { background: #FFFFFF; padding: 20px; min-width: 0; }
    .kpi { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .kpi b { font-family: 'Geist Mono', monospace; font-weight: 500; letter-spacing: -0.02em; font-size: 26px; line-height: 1; }
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="{{ url_for('booking_list') }}">
      <span class="mono fw-medium">N5 / booking</span>
      <span class="small muted">BTL2_Booking_Nhom5</span>
    </a>
    <nav class="d-flex flex-column gap-1" aria-label="Điều hướng chính">
      <a class="nav-item {{ 'active' if request.endpoint in ('booking_list', 'booking_edit') }}" href="{{ url_for('booking_list') }}" {{ 'aria-current=page' if request.endpoint == 'booking_list' }}>Danh sách booking</a>
      <a class="nav-item {{ 'active' if request.endpoint == 'booking_new' }}" href="{{ url_for('booking_new') }}">Thêm đơn</a>
      <a class="nav-item {{ 'active' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">Doanh thu</a>
    </nav>
    <div class="side-foot">Tài khoản DB: <span class="mono">btl2_app</span><br>SELECT + EXECUTE</div>
  </aside>
  <main class="content">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
      {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
